# -----------------------------------------------------------------------------
# LBB — Senior Year Command Center
# Single source of truth. Everything else reads from this file.
#
# Lines marked CONFIRM: were inferred from observed mail traffic on
# lbb122104@gmail.com and have NOT been verified. Correct them before relying
# on any routing rule that depends on them.
# -----------------------------------------------------------------------------

owner:
  name: Lucy Booth
  school: Tulane University
  year: senior
  term: Fall 2026

# ---------------------------------------------------------------------------
# ACCOUNTS
#
# status: live      = Claude can read it right now via a connector
#         manual    = no connector exists; data arrives by paste/export/feed
#         blocked   = connector exists but is not authorized yet
# ---------------------------------------------------------------------------
accounts:
  personal_gmail:
    address: lbb122104@gmail.com
    status: live
    connector: Gmail
    role: Personal life, shopping, finance, family, job alerts.
    volume: { messages: 73969, unread: 72517 }   # measured 2026-07-29

  school_outlook:
    address: lbooth1@tulane.edu           # CONFIRM: seen as a CC target, not verified as the Outlook box
    status: blocked
    connector: Microsoft 365
    role: Classes, registrar, advisor, campus admin.
    note: >
      Requires authorizing the Microsoft 365 connector on claude.ai. Grants
      read-only search over Outlook mail + calendar and Teams messages. There
      is no write access, so Outlook cleanup must be done with Outlook Rules
      (see mail/outlook-rules.md), not by the agent.

  work_gmail:
    address: lucy@nonsibi.vc
    status: blocked
    connector: Gmail
    role: Non Sibi Ventures — marketing. Second boss.
    note: >
      HARD LIMIT: the Gmail connector authorizes exactly one Google account.
      Personal Gmail currently holds that slot. Two Gmail accounts cannot both
      be live at once. See docs/two-gmail-problem.md for the three workarounds.

# ---------------------------------------------------------------------------
# PEOPLE — the allowlist that drives "urgent headlines"
#
# Anything from a `priority: high` address skips every filter, stays in the
# inbox, and surfaces at the top of the dashboard. This list is the single
# most important thing in the repo: it is what stops a boss email from being
# buried under 70,000 promos.
# ---------------------------------------------------------------------------
people:
  - handle: betsy-work
    address: bbiern@sf.wish.org
    org: Make-A-Wish Greater Bay Area
    title: CEO
    priority: high
    channel: email
    # CONFIRM: appears to be the non-profit / marketing side. Is this "boss #2"?
    note: Sends forwarded receipts and vendor coordination; often CCs lbooth1@tulane.edu.

  - handle: betsy-personal
    address: betsyb1115@yahoo.com
    priority: high
    channel: email
    # CONFIRM: same first name as betsy-work, but mails the Booth family
    # (tedbooth7@hotmail.com, charlieb2404@icloud.com). Same person wearing two
    # hats, or two different people? This changes whether her mail is "work".
    note: Family thread traffic. Relationship unverified.

  - handle: knud
    name: Knud Betherlesen              # CONFIRM: spelling, from voice input
    address: null                       # CONFIRM: likely an @tulane.edu address
    org: Tulane University
    title: Professor
    priority: high
    channel: groupme
    workspace: claude
    note: >
      Supervises the AI media internship. Primary channel is GroupMe, which has
      no connector. Add his Tulane address once known — that puts his email on
      the protected list automatically via never_filter_domains.

# Domains that are always real, never filtered, regardless of sender.
never_filter_domains:
  - tulane.edu
  - american.edu
  - sf.wish.org
  - nonsibi.vc

# ---------------------------------------------------------------------------
# WORKSPACES — the three spaces the dashboard is divided into. Each renders as
# its own section with its own accent, quick links, and mail lane.
#
# `match` routes a message into a space by sender domain. Unmatched mail falls
# through to the space with `default: true`.
# ---------------------------------------------------------------------------
workspaces:
  - id: tulane
    name: Tulane
    subtitle: School
    accent: "#006747"          # Tulane green
    accent_alt: "#418FDE"      # Tulane sky blue
    match: [tulane.edu, american.edu, instructure.com]
    links:
      - { label: "Gibson Online",  url: "https://gibson.tulane.edu/" }
      - { label: "Class Schedule", url: "https://classschedule.tulane.edu/Search.aspx" }
      - { label: "Canvas",         url: "https://tulane.instructure.com/", confirm: true }
      - { label: "Outlook",        url: "https://outlook.office.com/mail/" }
    panels: [due, docs]

  - id: claude
    name: Claude
    subtitle: AI media internship
    accent: "#B0603A"
    accent_alt: "#C98A5E"
    match: []                  # no email domain yet — see people.knud
    links:
      - { label: "GroupMe", url: "https://web.groupme.com/chats" }
    panels: [groupme]
    note: >
      AI media internship with Prof. Knud Betherlesen (Tulane). Primary channel
      is GroupMe, which has no connector — messages are pasted in and logged to
      data/groupme-log.md. See docs/canvas-and-groupme.md.

  - id: nonsibi
    name: Non Sibi
    subtitle: Marketing
    accent: "#3A4550"
    accent_alt: "#9A7B4F"
    match: [nonsibi.vc]
    links:
      - { label: "Non Sibi",         url: "https://nonsibi.vc/" }
      - { label: "Content Calendar", url: "", todo: true }
      - { label: "LinkedIn",         url: "https://www.linkedin.com/feed/" }
    panels: [calendar]

  - id: personal
    name: Personal
    subtitle: Everything else
    accent: "#6E7266"
    accent_alt: "#83887E"
    default: true
    match: []
    panels: []

